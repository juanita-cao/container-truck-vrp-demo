<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Drayage Planner">
  <rect width="48" height="48" rx="11" fill="#165dff"/>
  <!-- 集装箱（带波纹） -->
  <rect x="19" y="13" width="21" height="16" rx="1.5" fill="#ffffff"/>
  <g stroke="#165dff" stroke-width="1.4" stroke-linecap="round">
    <line x1="23" y1="15.5" x2="23" y2="26.5"/><line x1="27" y1="15.5" x2="27" y2="26.5"/>
    <line x1="31" y1="15.5" x2="31" y2="26.5"/><line x1="35" y1="15.5" x2="35" y2="26.5"/>
  </g>
  <!-- 牵引车头 -->
  <path d="M7 29V21.5a1.5 1.5 0 0 1 1.5-1.5H14a2 2 0 0 1 1.6.8L18 24v5z" fill="#ffffff"/>
  <path d="M10 22.2h3.4l1.8 2.3H10z" fill="#165dff"/>
