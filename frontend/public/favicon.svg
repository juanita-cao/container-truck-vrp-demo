  <rect x="7" y="29" width="33" height="2.6" rx="1.3" fill="#ffffff"/>
  <circle cx="18.4" cy="30.3" r="1.7" fill="#ffffff" stroke="#165dff" stroke-width="1.2"/>
  <!-- 车轮 -->
  <g fill="#ffffff" stroke="#165dff" stroke-width="1.6">
    <circle cx="13" cy="34.5" r="3"/><circle cx="26" cy="34.5" r="3"/><circle cx="35" cy="34.5" r="3"/>
  </g>
</svg>
